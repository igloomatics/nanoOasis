# Breakout pipeline-validation configuration; calibrate EDM after VAE training.



seed: 0

vae:
  hidden_dim: 128
  enc_layers: 2
  dec_layers: 3
  heads: 4
  patch_size: 8
  latent_channels: 16
  kl_beta: 1.0e-6
  mlp_ratio: 4

dit:
  hidden_dim: 128
  depth: 4
  heads: 4
  head_dim: 32
  patch_size: 2
  context_frames: 4
  num_actions: 3
  action_mode: concat
  mlp_ratio: 4

diffusion:

  sigma_data: 0.5
  sigma_min: 0.002
  sigma_max: 80.0
  rho: 7.0

  p_mean: -0.4
  p_std: 1.0

  forcing: true
  motion_weight: 5
  context_noise_min: 0.002
  context_noise_max: 0.25
  action_dropout: 0.1
  ar_steps: 1
  num_sample_steps: 4

training:
  device: auto
  batch_size: 4
  lr: 1.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_steps: 200
  total_steps: 5000
  grad_clip: 1.0
  ema_decay: 0.9999
  log_every: 50
  val_every: 1000
  ckpt_every: 1000

data:
  index_path: data/breakout_100k/index.parquet
  cache_size: 32
  event_frac: 0.4
